<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
    />

    <title>Web Scraper - Productos</title>
</head>

<body>
<main>
    <h1>Productos Falabella</h1>

    <form id="form-productos">
        <label for="txt-busqueda">
            Buscar producto
        </label>

        <input
                id="txt-busqueda"
                name="busqueda"
                type="text"
                placeholder="Ej: Lenovo"
        />

        <button type="submit">
            Buscar
        </button>
    </form>

    <p
            id="bloque-error"
            role="alert"
    ></p>

    <section
            id="contenedor-catalogo"
            aria-live="polite"
    ></section>
</main>

<script
        type="module"
        src="/src/main.ts"
></script>
</body>
</html>
